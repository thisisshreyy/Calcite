name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses & Ensure SDK Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Calcite.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calcite-Android-APK
          path: build-output/Calcite.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Calcite Android App (Latest APK)"
          body: |
            ## 📱 Calcite Android APK
            
            Download and install the native Android APK directly on your phone:
            - **Local-first offline functionality**
            - **Painless Gmail Sign-In & Cloud Sync**
            - **Dark UI & native status bar**
            - **Hardware back button support**
            
            ### How to Install:
            1. Download `Calcite.apk` below directly onto your Android device.
            2. Tap the downloaded file and select **Install** (if prompted, allow "Install unknown apps" for your browser).
            3. Open Calcite!
          files: build-output/Calcite.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
